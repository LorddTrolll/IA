services:
  - type: web
    name: lumina-clinica
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'false'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_URL
        sync: false
# Opcional: adicione XAI_API_KEY e XAI_MODEL no painel do Render.
# Nenhum disco SQLite é usado em produção; os dados ficam no Supabase.
